appId: io.github.openrootz.e-invoice-desktop
productName: E-Invoice Desktop
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.{map,md,ts}'
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: e-invoice-desktop-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Master data stays when the app is uninstalled
  deleteAppDataOnUninstall: false
  artifactName: e-invoice-desktop-${version}-setup-${arch}.${ext}
portable:
  artifactName: e-invoice-desktop-${version}-portable-${arch}.${ext}
# Icon: build/icon.ico (rendered from build/icon.svg). No auto-update: releases are downloaded manually from GitHub
publish: null
